# Example production reverse proxy — install on the host or a dedicated gateway container.
# Replace example.com domains and SSL cert paths before use.

upstream enderas_api {
    server 127.0.0.1:3000;
}

upstream enderas_public {
    server 127.0.0.1:8080;
}

upstream enderas_admin {
    server 127.0.0.1:8081;
}

# API
server {
    listen 443 ssl http2;
    server_name api.enderas.et;

    ssl_certificate     /etc/letsencrypt/live/api.enderas.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.enderas.et/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://enderas_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Public bidder site
server {
    listen 443 ssl http2;
    server_name www.enderas.et enderas.et;

    ssl_certificate     /etc/letsencrypt/live/www.enderas.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.enderas.et/privkey.pem;

    location / {
        proxy_pass http://enderas_public;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Staff admin panel
server {
    listen 443 ssl http2;
    server_name admin.enderas.et;

    ssl_certificate     /etc/letsencrypt/live/admin.enderas.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.enderas.et/privkey.pem;

    location / {
        proxy_pass http://enderas_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
