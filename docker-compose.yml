services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${DB_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_HOST: mysql
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_V1_PREFIX: ${VITE_API_V1_PREFIX:-/v1}
        VITE_ADMIN_APP_URL: ${VITE_ADMIN_APP_URL}
        VITE_APP_KIND: public
        VITE_IOS_APP_URL: ${VITE_IOS_APP_URL:-}
        VITE_ANDROID_APP_URL: ${VITE_ANDROID_APP_URL:-}
    restart: unless-stopped
    ports:
      - '${PUBLIC_PORT:-8080}:80'
    depends_on:
      - backend

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_V1_PREFIX: ${VITE_API_V1_PREFIX:-/v1}
        VITE_PUBLIC_APP_URL: ${VITE_PUBLIC_APP_URL}
        VITE_APP_KIND: admin
    restart: unless-stopped
    ports:
      - '${ADMIN_PORT:-8081}:80'
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
